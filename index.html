<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>筆の間</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2C4A6E" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="縦書き対応・iPhone 向け小説執筆アプリ「筆の間」" />

  <!-- iOS ホーム画面（フルスクリーン化） -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="筆の間" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />

  <!-- 通常のファビコン（SVG 対応ブラウザ） -->
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />

  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body data-theme="light">
  <div class="device-frame" aria-label="iPhone モックアップ">
    <div class="notch" aria-hidden="true"></div>
    <div class="status-bar" aria-hidden="true">
      <span class="status-time">9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 16 10" width="16" height="10" aria-hidden="true"><rect x="0" y="3" width="2" height="4" rx="0.5" fill="currentColor"/><rect x="3" y="2" width="2" height="6" rx="0.5" fill="currentColor"/><rect x="6" y="1" width="2" height="8" rx="0.5" fill="currentColor"/><rect x="9" y="0" width="2" height="10" rx="0.5" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 12" width="24" height="12" aria-hidden="true"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="16" height="8" rx="1" fill="currentColor"/><rect x="21" y="4" width="2" height="4" rx="0.5" fill="currentColor"/></svg>
      </span>
    </div>

    <main id="screen-root" class="screen-root"></main>

    <nav id="bottom-nav" class="bottom-nav" hidden>
      <button class="nav-item" data-route="#screen-home" tabindex="-1">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>Top</span>
      </button>
      <button class="nav-item" data-route="#screen-todo" tabindex="-1">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>To Do</span>
      </button>
      <button class="nav-item" data-route="#screen-ideas" tabindex="-1">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>ネタ帳</span>
      </button>
      <button class="nav-item" data-route="#screen-progress" tabindex="-1">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><path d="M4 19V5M4 19h16M7 15l4-6 3 4 5-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>進捗</span>
      </button>
      <button class="nav-item" data-route="#screen-settings" tabindex="-1">
        <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2L5 6l-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <div id="modal-root" class="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
